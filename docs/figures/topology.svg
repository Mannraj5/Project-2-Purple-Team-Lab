<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#f7f8fa"/>

  <text x="40" y="40" font-size="19" font-weight="600" fill="#1a1d23">Lab topology</text>
  <text x="40" y="62" font-size="13" fill="#5a6270">Isolated host-only segment — no route to the host LAN or the internet</text>

  <!-- Host boundary -->
  <rect x="40" y="82" width="680" height="252" rx="6" fill="none" stroke="#c4cad3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="103" font-size="12" font-weight="600" fill="#8a929e">WINDOWS 11 HOST · VIRTUALBOX 7.2.12</text>

  <!-- Attacker -->
  <rect x="72" y="124" width="252" height="104" rx="5" fill="#ffffff" stroke="#3d6fb4" stroke-width="2"/>
  <text x="88" y="150" font-size="15" font-weight="600" fill="#1a1d23">Kali Linux</text>
  <text x="88" y="172" font-size="12.5" fill="#3d6fb4" font-weight="600">192.168.56.10</text>
  <text x="88" y="192" font-size="12" fill="#5a6270">Attacker · Metasploit</text>
  <text x="88" y="210" font-size="12" fill="#c0392b" font-weight="600">Snort 3.12.2 sensor (co-located)</text>

  <!-- Victim -->
  <rect x="436" y="124" width="252" height="104" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="452" y="150" font-size="15" font-weight="600" fill="#1a1d23">Windows 7 Enterprise SP1</text>
  <text x="452" y="172" font-size="12.5" fill="#c0392b" font-weight="600">192.168.56.20</text>
  <text x="452" y="192" font-size="12" fill="#5a6270">Victim · x86 · unpatched</text>
  <text x="452" y="210" font-size="12" fill="#5a6270">Firewall off · SMBv1 on · 445 open</text>

  <!-- Link -->
  <line x1="324" y1="176" x2="436" y2="176" stroke="#5a6270" stroke-width="2"/>
  <polygon points="436,176 428,172 428,180" fill="#5a6270"/>
  <polygon points="324,176 332,172 332,180" fill="#5a6270"/>

  <!-- Segment bar -->
  <rect x="72" y="262" width="616" height="34" rx="4" fill="#e8ecf2"/>
  <text x="380" y="284" font-size="13" font-weight="600" fill="#3a4250" text-anchor="middle">Host-only segment · 192.168.56.0/24 · DHCP disabled · no gateway</text>
  <line x1="198" y1="228" x2="198" y2="262" stroke="#8a929e" stroke-width="1.5"/>
  <line x1="562" y1="228" x2="562" y2="262" stroke="#8a929e" stroke-width="1.5"/>

  <!-- Consequence note -->
  <rect x="40" y="348" width="680" height="34" rx="4" fill="#fdf0ee"/>
  <text x="56" y="370" font-size="12.5" fill="#8c2f22">Host VBS held VT-x, so a third VM for a dedicated sensor could not be built. Capturing on an endpoint caused both offload failures.</text>
</svg>
